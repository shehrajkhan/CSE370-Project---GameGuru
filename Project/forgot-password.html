<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  <link rel="stylesheet" href="forgot-password.css">
</head>
<body>
  <div class="login-container">
    <div class="form-container">
      <h2>Forgot Password</h2>
      <p class="info-text">Enter your email address, and we'll send you a link to reset your password.</p>
      <form action="#" method="POST" class="forgot-password-form">
        <div class="input-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <button type="submit" class="btn">Send Reset Link</button>
        <p class="login-text">
          Remembered your password? <a href="login.html" class="login-link">Log In</a>
        </p>
      </form>
    </div>
  </div>
</body>
</html>
